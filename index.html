<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VetZhèn · Plataforma de Veterinária Intergrativa </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root{
    /* VetZhèn — paleta oficial da marca */
    --brand-green:#496449;
    --brand-green-deep:#32472F;
    --brand-cream:#EFECE6;
    --brand-blue:#244573;
    --brand-terracotta:#9F4A2E;
    --brand-tan:#D4B999;
    --brand-tan-deep:#8C6C41;
    --brand-sage:#9DA29B;

    --ink:#2A362A;
    --ink-soft:#465247;
    --paper:#EFECE6;
    --paper-card:#FFFFFF;
    --line:#E2DACB;
    --jade:#496449;
    --jade-deep:#32472F;
    --cinnabar:#9F4A2E;
    --gold:#8C6C41;
    --water:#244573;
    --metal:#9DA29B;
    --wood:#496449;
    --earth:#8C6C41;
    --fire:#9F4A2E;
    --text-muted:#6B7269;
    --radius:7px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Montserrat',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:#C9DCD3;}
  .app{max-width:1180px;margin:0 auto;padding:0 20px 80px;}

  /* ---------- HEADER ---------- */
  .topbar{
    background:#FBFAF6;
    color:var(--ink);
    padding:16px 20px;
    margin-bottom:26px;
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-logo{height:38px;width:auto;display:block;}
  .nav{display:flex;align-items:center;gap:6px;}
  .nav button{
    background:transparent;
    border:1px solid transparent;
    color:var(--jade-deep);
    font-family:'Montserrat',sans-serif;
    font-size:13.5px;
    font-weight:600;
    padding:8px 14px;
    border-radius:5px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .nav button:hover{border-color:var(--line);background:#F1EEE6;}
  .nav button.active{background:var(--brand-green-deep);color:#fff;border-color:var(--brand-green-deep);}

  /* ---------- WAVE DIVIDER (signature motif: pulse / meridian line) ---------- */
  .pulse-divider{width:100%;height:14px;margin:22px 0;opacity:0.55;}

  /* ---------- BUTTONS ---------- */
  .btn{
    font-family:'Montserrat',sans-serif;
    font-weight:600;
    font-size:13.5px;
    border-radius:5px;
    padding:9px 16px;
    border:1px solid transparent;
    cursor:pointer;
    transition:all .15s ease;
    display:inline-flex;align-items:center;gap:7px;
  }
  .btn-primary{background:var(--jade);color:#fff;}
  .btn-primary:hover{background:var(--jade-deep);}
  .btn-ghost{background:transparent;color:var(--ink-soft);border-color:var(--line);}
  .btn-ghost:hover{border-color:var(--jade);color:var(--jade-deep);}
  .btn-danger{background:transparent;color:var(--cinnabar);border-color:#E3C6BE;}
  .btn-danger:hover{background:#FBEEEB;}
  .btn-small{padding:6px 11px;font-size:12.5px;}

  /* ---------- DASHBOARD / LIST VIEW ---------- */
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px;}
  .stat-card{background:var(--paper-card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
  .stat-num{font-family:'PT Serif',serif;font-size:30px;font-weight:600;color:var(--ink);}
  .stat-label{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-top:2px;}

  .list-toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
  .search-wrap{position:relative;flex:1;min-width:220px;max-width:420px;}
  .search-wrap input{
    width:100%;padding:10px 14px 10px 34px;border-radius:6px;border:1px solid var(--line);
    font-family:'Montserrat';font-size:14px;background:#fff;
  }
  .search-wrap input:focus{outline:2px solid var(--jade);outline-offset:1px;}
  .search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:0.5;font-size:14px;}

  .section-eyebrow{
    font-family:'Montserrat',sans-serif;
    font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);
    margin-bottom:6px;
  }
  h1.page-title{font-family:'PT Serif',serif;font-weight:600;font-size:26px;margin:0 0 4px;}
  .page-sub{color:var(--text-muted);font-size:14px;margin:0 0 20px;}

  .patient-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
  .patient-card{
    background:var(--paper-card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 16px 14px;cursor:pointer;transition:box-shadow .15s ease, border-color .15s ease;
    display:flex;flex-direction:column;gap:10px;
  }
  .patient-card:hover{border-color:var(--jade);box-shadow:0 3px 14px rgba(31,46,43,0.08);}
  .patient-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .patient-name{font-family:'PT Serif',serif;font-weight:600;font-size:18px;color:var(--ink);}
  .patient-meta{font-size:12.5px;color:var(--text-muted);margin-top:2px;}
  .mini-radar{flex-shrink:0;}
  .badge{
    font-size:10.5px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;
    padding:3px 9px;border-radius:20px;white-space:nowrap;
  }
  .badge-ativo{background:#E4EFE9;color:var(--jade-deep);}
  .badge-alta{background:#EEECE0;color:var(--gold);}
  .badge-pausado{background:#F1E6E2;color:var(--cinnabar);}
  .badge-avaliacao{background:#E6EBF1;color:var(--water);}
  .patient-card-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:10px;font-size:12px;color:var(--text-muted);}
  .empty-state{
    text-align:center;padding:60px 20px;color:var(--text-muted);border:1px dashed var(--line);border-radius:var(--radius);
  }
  .empty-state h3{font-family:'PT Serif',serif;color:var(--ink);margin-bottom:6px;}

  /* ---------- FORM VIEW ---------- */
  .form-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:6px;flex-wrap:wrap;}
  .form-header-left{display:flex;gap:16px;align-items:center;}
  .save-indicator{font-size:12px;color:var(--text-muted);font-family:'Montserrat',sans-serif;}
  .save-indicator.saved{color:var(--jade-deep);}

  .patient-id-card{
    background:var(--paper-card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 20px;margin-bottom:16px;
  }
  .id-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px 16px;}

  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:11.5px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;}
  .field input[type=text], .field input[type=number], .field input[type=date], .field input[type=time], .field select, .field textarea{
    font-family:'Montserrat';font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);width:100%;
  }
  .field textarea{resize:vertical;min-height:56px;font-family:'Montserrat';line-height:1.45;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--jade);outline-offset:0;border-color:var(--jade);}

  .chip-group{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{
    font-size:12.5px;font-weight:500;padding:6px 12px;border-radius:20px;border:1px solid var(--line);
    background:#fff;color:var(--ink-soft);cursor:pointer;transition:all .12s ease;user-select:none;
  }
  .chip:hover{border-color:var(--jade);}
  .chip.chip-active{background:var(--jade);border-color:var(--jade);color:#fff;}
  .chip.chip-active.chip-alert{background:var(--cinnabar);border-color:var(--cinnabar);}

  .accordion{background:var(--paper-card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
  .accordion-head{
    display:flex;justify-content:space-between;align-items:center;padding:14px 18px;cursor:pointer;
  }
  .accordion-head:hover{background:#F7FAF8;}
  .accordion-title{font-family:'PT Serif',serif;font-weight:600;font-size:16.5px;display:flex;align-items:center;gap:9px;}
  .accordion-num{font-family:'Montserrat';font-size:11px;font-weight:600;color:var(--gold);border:1px solid var(--brand-tan);border-radius:4px;padding:1px 6px;}
  .accordion-chevron{color:var(--text-muted);font-size:13px;transition:transform .15s ease;}
  .accordion.open .accordion-chevron{transform:rotate(90deg);}
  .accordion-body{padding:4px 18px 18px;display:none;}
  .accordion.open .accordion-body{display:block;}
  .field-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px 16px;margin-bottom:14px;}
  .field-grid.wide{grid-template-columns:repeat(auto-fit,minmax(340px,1fr));}
  .field.span2{grid-column:span 2;}

  /* ---------- FIVE ELEMENTS (Cinco Movimentos) ---------- */
  .elements-layout{display:grid;grid-template-columns:260px 1fr;gap:24px;align-items:start;}
  @media (max-width:760px){.elements-layout{grid-template-columns:1fr;}}
  .radar-box{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:center;position:sticky;top:16px;}
  .radar-caption{font-size:11.5px;color:var(--text-muted);margin-top:8px;line-height:1.4;}
  .element-block{border-left:3px solid var(--line);padding:4px 0 4px 14px;margin-bottom:16px;}
  .element-title{font-family:'PT Serif',serif;font-weight:600;font-size:15.5px;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
  .element-dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .element-sub{font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin:8px 0 5px;}

  /* ---------- TREATMENT SESSIONS ---------- */
  .session-timeline{display:flex;flex-direction:column;gap:12px;margin-top:6px;}
  .session-card{background:#fff;border:1px solid var(--line);border-left:3px solid var(--jade);border-radius:6px;padding:14px 16px;}
  .session-card-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .session-num{font-family:'Montserrat';font-weight:600;color:var(--jade-deep);font-size:13px;}
  .session-date{font-size:12.5px;color:var(--text-muted);}
  .session-body{font-size:13.5px;line-height:1.55;color:var(--ink-soft);}
  .session-tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;}
  .tag-pill{font-size:11px;background:#EEF2ED;color:var(--jade-deep);padding:3px 9px;border-radius:20px;font-weight:600;}
  .score-row{display:flex;gap:18px;margin-top:8px;}
  .score-chip{font-family:'Montserrat';font-size:12px;padding:4px 9px;border-radius:5px;background:#F5F2E6;color:var(--gold);}
  .score-chip.dor{background:#FBEEEB;color:var(--cinnabar);}
  .score-chip.mob{background:#EAF1EC;color:var(--jade-deep);}
  .session-foot{display:flex;justify-content:space-between;margin-top:10px;font-size:11.5px;color:var(--text-muted);}

  .new-session-form{background:#F7FAF8;border:1px dashed var(--jade);border-radius:var(--radius);padding:18px;margin-top:14px;}
  .slider-row{display:flex;align-items:center;gap:12px;}
  .slider-row input[type=range]{flex:1;accent-color:var(--jade);}
  .slider-val{font-family:'Montserrat';font-weight:600;width:26px;text-align:right;}

  .chart-box{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;}
  .chart-legend{display:flex;gap:16px;font-size:12px;margin-bottom:6px;color:var(--text-muted);}
  .legend-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;}

  .back-link{background:none;border:none;color:var(--text-muted);font-size:13px;cursor:pointer;padding:0;margin-bottom:10px;display:flex;align-items:center;gap:5px;}
  .back-link:hover{color:var(--jade-deep);}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#F2F6F3;padding:10px 20px;border-radius:6px;font-size:13px;
    opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  @media (max-width:600px){
    .stat-row{grid-template-columns:repeat(2,1fr);}
    .id-grid{grid-template-columns:1fr 1fr;}
  }

  /* ---------- SETUP / CONNECTION SCREENS ---------- */
  .setup-screen{max-width:640px;margin:60px auto;background:var(--paper-card);border:1px solid var(--line);border-radius:var(--radius);padding:34px 36px;}
  .setup-screen h2{font-family:'PT Serif',serif;font-size:22px;margin:0 0 10px;}
  .setup-screen p{font-size:14px;line-height:1.6;color:var(--ink-soft);}
  .setup-screen ol{padding-left:20px;font-size:14px;line-height:1.9;color:var(--ink-soft);}
  .setup-screen code{background:#F1F4F1;padding:2px 6px;border-radius:4px;font-family:'Montserrat';font-size:12.5px;}
  .setup-screen pre{background:#1F2E2B;color:#DCE7E1;padding:14px 16px;border-radius:6px;font-family:'Montserrat';font-size:12.5px;overflow-x:auto;line-height:1.6;}
  .loading-screen{text-align:center;padding:80px 20px;color:var(--text-muted);font-size:14px;}

  /* ---------- LOGIN ---------- */
  .login-wrap{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{background:var(--paper-card);border:1px solid var(--line);border-radius:var(--radius);padding:36px 34px;width:100%;max-width:380px;}
  .login-card .brand-mark{display:none;}
  .login-logo{height:74px;width:auto;display:block;margin:0 auto 4px;}
  .login-sub{font-size:13px;color:var(--text-muted);margin:0 0 22px;}
  .login-card .field{margin-bottom:14px;}
  .login-error{background:#FBEEEB;color:var(--cinnabar);font-size:13px;padding:9px 12px;border-radius:5px;margin-bottom:14px;display:none;}
  .login-error.show{display:block;}
  .btn-block{width:100%;justify-content:center;padding:10px;font-size:14px;}
  .user-chip{
    display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-muted);
    border-left:1px solid var(--line);padding-left:12px;margin-left:6px;
  }
  .user-chip button{background:none;border:none;color:var(--brand-terracotta);font-size:12px;cursor:pointer;text-decoration:underline;padding:0;}
  .user-chip button:hover{color:var(--jade-deep);}
</style>
</head>

<script>
/* =========================================================================

// ============ CONFIGURAÇÃO DO FIREBASE (preencher uma única vez) ============
// Veja as instruções completas na tela de configuração exibida ao abrir este
// arquivo sem preencher os dados abaixo, ou no guia enviado junto com o app.
const firebaseConfig = {
  apiKey: "AIzaSyDcvoaBfWgVMXSP1w_0o9HlEWcdSqI-XdM",
  authDomain: "vetzhen-fichas.firebaseapp.com",

  storageBucket: "vetzhen-fichas.firebasestorage.app",

const root = document.getElementById('view-root');
const toastEl = document.getElementById('toast');
let state = { view:'list', patientId:null, patient:null, search:'', open:{} , sessionDraft:null};
let index = [];
let saveTimer = null;
let db = null;
let auth = null;
let unsubscribeList = null;
let currentUser = null;

/* ---------------- helpers ---------------- */
function uid(){ return 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function nowISODate(){ const d=new Date(); return d.toISOString().slice(0,10); }
function nowTime(){ const d=new Date(); return d.toTimeString().slice(0,5); }
function fmtDate(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return d && m && y ? `${d}/${m}/${y}` : iso; }
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastEl._t); toastEl._t = setTimeout(()=>toastEl.classList.remove('show'), 1600); }

/* ---------------- Firestore data layer ---------------- */
function isConfigured(){
  return firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith('COLE_AQUI');
}
function renderSetupScreen(errorMsg){
  root.innerHTML = `<div class="setup-screen">
    <div class="section-eyebrow">Configuração necessária</div>
    <h2>Conecte o banco de dados da equipe</h2>
    <p>Este site precisa de um banco de dados gratuito (Firebase) para que todas as veterinárias vejam as mesmas fichas em tempo real, em qualquer dispositivo.</p>
    ${errorMsg ? `<p style="color:#9F4A2E;"><strong>Erro ao conectar:</strong> ${esc(errorMsg)}</p>` : ''}
    <ol>
      <li>Acesse <code>console.firebase.google.com</code> e crie um projeto gratuito.</li>
      <li>Em <strong>Authentication</strong> → aba "Sign-in method" → ative o provedor <strong>Email/senha</strong>. Depois, na aba "Users", clique em "Add user" e crie um login (e-mail + senha) para cada veterinária da equipe — esse é o controle de quem tem acesso.</li>
      <li>Em <strong>Firestore Database</strong> → <strong>Criar banco de dados</strong> (modo produção está ok).</li>
      <li>Em <strong>Regras</strong> do Firestore, cole:
        <pre>rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /patients/{doc} {
      allow read, write: if request.auth != null;
    }
  }
}</pre>
      </li>
      <li>Em <strong>Configurações do projeto</strong> (ícone de engrenagem) → role até "Seus apps" → clique no ícone <strong>&lt;/&gt;</strong> (Web) → registre um app.</li>
      <li>Copie o objeto <code>firebaseConfig</code> mostrado e cole no início do arquivo HTML, substituindo os valores de exemplo.</li>
      <li>Salve o arquivo e hospede-o (ex: GitHub Pages) para que toda a equipe acesse pelo mesmo link.</li>
    </ol>
    <p>Depois de preencher e salvar o arquivo, é só recarregar esta página.</p>
  </div>`;
}
async function initFirebase(){
  if(!isConfigured()){ renderSetupScreen(); return false; }
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    auth = firebase.auth();
    return true;
  }catch(e){
    renderSetupScreen(e.message);
    return false;
  }
}
function subscribeList(){
  if(unsubscribeList) unsubscribeList();
  unsubscribeList = db.collection('patients').orderBy('updatedAt','desc').onSnapshot(
    snap=>{
      index = snap.docs.map(d=>({ id:d.id, ...d.data() }));
      if(state.view==='list') renderList();
    },
    err=>{ console.error(err); renderSetupScreen('Não foi possível ler os dados. Verifique as regras do Firestore. (' + err.message + ')'); }
  );
}
async function fetchPatient(id){
  const doc = await db.collection('patients').doc(id).get();
  return doc.exists ? { id: doc.id, ...doc.data() } : null;
}
async function persistPatient(p){
  await db.collection('patients').doc(p.id).set(p);
}
async function removePatient(id){
  await db.collection('patients').doc(id).delete();
}

async function boot(){
  root.innerHTML = '<div class="loading-screen">Conectando ao banco de dados da equipe…</div>';
  const ok = await initFirebase();
  if(!ok) return;
  auth.onAuthStateChanged(user=>{
    currentUser = user;
    updateNav();
    if(user){
      subscribeList();
      if(state.view==='login' || !state.view) state.view='list';
      render();
    } else {
      if(unsubscribeList){ unsubscribeList(); unsubscribeList=null; }
      state.view='login';
      render();
    }
  });
}

function updateNav(){
  const nav = document.getElementById('nav');
  const userInfo = document.getElementById('user-info');
  if(currentUser){
    nav.style.display='flex';
    userInfo.style.display='inline-flex';
    userInfo.className='user-chip';
    userInfo.innerHTML = `${esc(currentUser.email)} <button id="logout-btn">sair</button>`;
    document.getElementById('logout-btn').addEventListener('click', ()=> auth.signOut());
  } else {
    nav.style.display='none';
  }
}

/* ---------------- nav ---------------- */
document.getElementById('nav-list').addEventListener('click', ()=>{ state.view='list'; state.patientId=null; render(); });
document.getElementById('nav-new').addEventListener('click', createPatient);

async function createPatient(){
  const p = blankPatient();
  await persistPatient(p);
  state.view='form'; state.patientId=p.id; state.patient=p; state.open={anamnese:true};
  render();
  showToast('Nova ficha criada');
}

async function openPatient(id){
  const p = await fetchPatient(id);
  if(!p){ showToast('Não foi possível carregar a ficha'); return; }
  state.view='form'; state.patientId=id; state.patient=p; state.open={anamnese:true};
  render();
}

async function deletePatient(id, ev){
  ev.stopPropagation();
  if(!confirm('Excluir esta ficha permanentemente? Esta ação não pode ser desfeita.')) return;
  await removePatient(id);
  showToast('Ficha excluída');
}

/* ---------------- persistence ---------------- */
function queueSave(){
  const el = document.getElementById('save-indicator');
  if(el){ el.textContent='Salvando…'; el.classList.remove('saved'); }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 550);
}
async function doSave(){
  if(!state.patient) return;
  state.patient.updatedAt = Date.now();
  await persistPatient(state.patient);
  const el = document.getElementById('save-indicator');
  if(el){ el.textContent='Salvo · '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); el.classList.add('saved'); }
}

/* ---------------- five elements scoring ---------------- */
function elementScore(mov, key){
  const e = ELEMENTOS.find(x=>x.key===key);
  const arr = (mov[key] && mov[key].anormal) || [];
  return e.anormal.length ? arr.length / e.anormal.length : 0;
}
function radarSVG(mov, size){
  size = size || 210;
  const cx=size/2, cy=size/2, R=size*0.36;
  const n = ELEMENTOS.length;
  function pt(i, v){
    const angle = -Math.PI/2 + i*(2*Math.PI/n);
    return [cx + Math.cos(angle)*R*v, cy + Math.sin(angle)*R*v];
  }
  let grid='';
  [0.33,0.66,1].forEach(ring=>{
    let pts=[];
    for(let i=0;i<n;i++){ pts.push(pt(i,ring).join(',')); }
    grid += `<polygon points="${pts.join(' ')}" fill="none" stroke="#E2DACB" stroke-width="1"/>`;
  });
  let axes='', labels='';
  ELEMENTOS.forEach((e,i)=>{
    const [x,y] = pt(i,1.14);
    const [ax,ay] = pt(i,1);
    axes += `<line x1="${cx}" y1="${cy}" x2="${ax}" y2="${ay}" stroke="#E2DACB" stroke-width="1"/>`;
    labels += `<text x="${x}" y="${y}" font-size="10.5" font-family="Montserrat" font-weight="600" fill="${e.color}" text-anchor="middle" dominant-baseline="middle">${e.label}</text>`;
  });
  let dataPts=[];
  ELEMENTOS.forEach((e,i)=>{ dataPts.push(pt(i, 0.12 + elementScore(mov,e.key)*0.88 * (elementScore(mov,e.key)>0?1:0) ).join(',')); });
  // recompute properly (avoid 0-collapse weirdness): use radius floor for visibility of center
  dataPts = ELEMENTOS.map((e,i)=>{
    const v = elementScore(mov,e.key);
    const rv = v===0 ? 0.06 : 0.18 + v*0.82;
    return pt(i, rv).join(',');
  });
  const dots = ELEMENTOS.map((e,i)=>{
    const v = elementScore(mov,e.key);
    const rv = v===0 ? 0.06 : 0.18 + v*0.82;
    const [x,y] = pt(i, rv);
    return `<circle cx="${x}" cy="${y}" r="3.3" fill="${e.color}"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
    ${grid}${axes}
    <polygon points="${dataPts.join(' ')}" fill="#9F4A2E" fill-opacity="0.14" stroke="#9F4A2E" stroke-width="1.6"/>
    ${dots}
    ${labels}
  </svg>`;
}
function miniRadarSVG(mov){ return radarSVG(mov, 58); }

/* ---------------- evolution line chart ---------------- */
function evolutionChartSVG(sessions){
  if(!sessions.length) return '<div style="color:#8b9a94;font-size:13px;padding:20px 0;text-align:center;">Sem sessões registradas ainda para plotar a evolução.</div>';
  const W=640,H=180,padL=30,padR=14,padT=14,padB=26;
  const n = sessions.length;
  const stepX = n>1 ? (W-padL-padR)/(n-1) : 0;
  function y(v){ return padT + (10-v)/10 * (H-padT-padB); }
  function pathFor(field){
    return sessions.map((s,i)=>{
      const x = padL + i*stepX;
      const v = (s[field]===undefined || s[field]===null || s[field]==='') ? null : Number(s[field]);
      return v===null ? null : `${i===0?'M':'L'}${x.toFixed(1)},${y(v).toFixed(1)}`;
    }).filter(Boolean).join(' ');
  }
  function dotsFor(field, color){
    return sessions.map((s,i)=>{
      const x = padL + i*stepX;
      const v = s[field];
      if(v===undefined||v===null||v==='') return '';
      return `<circle cx="${x.toFixed(1)}" cy="${y(Number(v)).toFixed(1)}" r="3" fill="${color}"/>`;
    }).join('');
  }
  let gridLines='';
  for(let g=0; g<=10; g+=2){
    gridLines += `<line x1="${padL}" y1="${y(g)}" x2="${W-padR}" y2="${y(g)}" stroke="#EAEFEA" stroke-width="1"/>
      <text x="${padL-6}" y="${y(g)+3}" font-size="9.5" fill="#8C8F7F" text-anchor="end" font-family="Montserrat">${g}</text>`;
  }
  const xLabels = sessions.map((s,i)=>{
    const x = padL + i*stepX;
    return `<text x="${x.toFixed(1)}" y="${H-8}" font-size="9" fill="#8C8F7F" text-anchor="middle" font-family="Montserrat">${fmtDate(s.data).slice(0,5)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="xMidYMid meet">
    ${gridLines}
    <path d="${pathFor('dor')}" fill="none" stroke="#9F4A2E" stroke-width="2"/>
    ${dotsFor('dor','#9F4A2E')}
    <path d="${pathFor('mobilidade')}" fill="none" stroke="#496449" stroke-width="2"/>
    ${dotsFor('mobilidade','#496449')}
    ${xLabels}
  </svg>`;
}

/* ---------------- render: master ---------------- */
function render(){
  if(state.view==='login'){ renderLogin(); return; }
  document.getElementById('nav-list').classList.toggle('active', state.view==='list');
  if(state.view==='list') renderList();
  else if(state.view==='form') renderForm();
}

/* ---------------- render: list ---------------- */
function renderList(){
  const q = state.search.trim().toLowerCase();
  const filtered = index.filter(p=>{
    if(!q) return true;
    return (p.nome||'').toLowerCase().includes(q) || (p.especie||'').toLowerCase().includes(q) || (p.proprietario||'').toLowerCase().includes(q);
  }).sort((a,b)=> (b.updatedAt||0)-(a.updatedAt||0));

  const emTratamento = index.filter(p=>p.status==='tratamento').length;
  const emAvaliacao = index.filter(p=>p.status==='avaliacao'||!p.status).length;
  const altas = index.filter(p=>p.status==='alta').length;

  root.innerHTML = `
    <div class="section-eyebrow">Painel da equipe</div>
    <h1 class="page-title">Pacientes em acompanhamento</h1>
    <p class="page-sub">Fichas de fisiatria, acupuntura e MVTC compartilhadas com toda a equipe de veterinárias da VetZhèn.</p>

    <div class="stat-row">
      <div class="stat-card"><div class="stat-num">${index.length}</div><div class="stat-label">Pacientes cadastrados</div></div>
      <div class="stat-card"><div class="stat-num">${emTratamento}</div><div class="stat-label">Em tratamento</div></div>
      <div class="stat-card"><div class="stat-num">${emAvaliacao}</div><div class="stat-label">Em avaliação</div></div>
      <div class="stat-card"><div class="stat-num">${altas}</div><div class="stat-label">Alta clínica</div></div>
    </div>

    <div class="list-toolbar">
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input id="search-input" type="text" placeholder="Buscar por nome, espécie ou tutor…" value="${esc(state.search)}">
      </div>
      <button class="btn btn-primary" id="new-btn-2">+ Novo paciente</button>
    </div>

    ${filtered.length ? `<div class="patient-grid">${filtered.map(cardHTML).join('')}</div>` : emptyStateHTML(q)}
  `;
  document.getElementById('search-input').addEventListener('input', e=>{ state.search=e.target.value; renderList(); });
  document.getElementById('search-input').focus();
  document.getElementById('search-input').setSelectionRange(state.search.length, state.search.length);
  document.getElementById('new-btn-2').addEventListener('click', createPatient);
  document.querySelectorAll('[data-open]').forEach(el=> el.addEventListener('click', ()=>openPatient(el.getAttribute('data-open'))));
  document.querySelectorAll('[data-del]').forEach(el=> el.addEventListener('click', (ev)=>deletePatient(el.getAttribute('data-del'), ev)));
}

function statusBadge(status){
  const map = { avaliacao:['Em avaliação','badge-avaliacao'], tratamento:['Em tratamento','badge-ativo'], alta:['Alta clínica','badge-alta'], pausado:['Pausado','badge-pausado'] };
  const [label, cls] = map[status] || map.avaliacao;
  return `<span class="badge ${cls}">${label}</span>`;
}

function cardHTML(p){
  return `<div class="patient-card" data-open="${p.id}">
    <div class="patient-card-top">
      <div>
        <div class="patient-name">${esc(p.nome||'Sem nome')}</div>
        <div class="patient-meta">${esc(p.especie||'Espécie não informada')} · Tutor: ${esc(p.proprietario||'—')}</div>
      </div>
      ${statusBadge(p.status)}
    </div>
    <div class="patient-card-foot">
      <span>Atualizado em ${new Date(p.updatedAt||Date.now()).toLocaleDateString('pt-BR')}</span>
      <button class="btn btn-danger btn-small" data-del="${p.id}">Excluir</button>
    </div>
  </div>`;
}

function emptyStateHTML(q){
  return `<div class="empty-state">
    <h3>${q ? 'Nenhum paciente encontrado' : 'Nenhuma ficha cadastrada ainda'}</h3>
    <p>${q ? 'Tente buscar por outro nome, espécie ou tutor.' : 'Crie a primeira ficha de atendimento para começar a acompanhar a evolução dos pacientes.'}</p>
  </div>`;
}

/* ---------------- render: form ---------------- */
function renderForm(){
  const p = state.patient;
  root.innerHTML = `
    <button class="back-link" id="back-btn">← Voltar para pacientes</button>

    <div class="patient-id-card">
      <div class="form-header">
        <div class="section-eyebrow">Ficha de atendimento · MVTC</div>
        <span id="save-indicator" class="save-indicator saved">Sincronizado</span>
      </div>
      <div class="id-grid">
        ${idField('nome','Nome do animal','text', p.nome)}
        ${idField('especie','Espécie','text', p.especie)}
        ${idSelect('sexo','Sexo',['','F','M'], p.sexo)}
        ${idField('idade','Idade','text', p.idade)}
        ${idField('cor','Cor','text', p.cor)}
        ${idField('raca','Raça','text', p.raca)}
        ${idField('proprietario','Proprietário(a)','text', p.proprietario)}
        ${idField('telefone','Telefone','text', p.telefone)}
        ${idField('dataAvaliacao','Data da 1ª avaliação','date', p.dataAvaliacao)}
        ${idField('veterinaria','Veterinária responsável','text', p.veterinaria)}
        ${idSelect('status','Status', [['avaliacao','Em avaliação'],['tratamento','Em tratamento'],['pausado','Pausado'],['alta','Alta clínica']], p.status)}
      </div>
    </div>

    <div id="sections-root"></div>

    <div id="elements-root"></div>

    <div class="accordion" id="acc-tratamento">
      <div class="accordion-head" data-acc="tratamento">
        <div class="accordion-title"><span class="accordion-num">12</span> Tratamentos e evolução</div>
        <span class="accordion-chevron">›</span>
      </div>
      <div class="accordion-body" id="tratamento-body"></div>
    </div>
  `;

  document.getElementById('back-btn').addEventListener('click', ()=>{ state.view='list'; render(); });
  bindIdFields();

  const secRoot = document.getElementById('sections-root');
  secRoot.innerHTML = SECTIONS.map(s=>sectionAccordionHTML(s)).join('');
  bindAccordions(secRoot);
  bindSectionFields(secRoot);

  document.getElementById('elements-root').innerHTML = elementsAccordionHTML();
  bindAccordions(document.getElementById('elements-root'));
  bindElementChips();
  refreshRadar();

  document.getElementById('tratamento-body').innerHTML = tratamentoBodyHTML();
  bindTratamento();
  if(state.open.tratamento) document.getElementById('acc-tratamento').classList.add('open');

  document.querySelectorAll('.accordion-head').forEach(h=>{
    h.addEventListener('click', ()=>{
      const key = h.getAttribute('data-acc');
      const acc = h.closest('.accordion');
      const willOpen = !acc.classList.contains('open');
      acc.classList.toggle('open', willOpen);
      state.open[key] = willOpen;
    });
  });
}

function idField(key,label,type,val){
  return `<div class="field"><label>${label}</label><input data-id-field="${key}" type="${type}" value="${esc(val||'')}"></div>`;
}
function idSelect(key,label,options,val){
  const opts = options.map(o=>{
    const [v,l] = Array.isArray(o)?o:[o,o||'—'];
    return `<option value="${v}" ${val===v?'selected':''}>${l}</option>`;
  }).join('');
  return `<div class="field"><label>${label}</label><select data-id-field="${key}">${opts}</select></div>`;
}
function bindIdFields(){
  document.querySelectorAll('[data-id-field]').forEach(el=>{
    el.addEventListener('input', ()=>{ state.patient[el.getAttribute('data-id-field')] = el.value; queueSave(); });
    el.addEventListener('change', ()=>{ state.patient[el.getAttribute('data-id-field')] = el.value; queueSave(); });
  });
}

function sectionAccordionHTML(sec){
  const isOpen = !!state.open[sec.id];
  return `<div class="accordion ${isOpen?'open':''}" id="acc-${sec.id}">
    <div class="accordion-head" data-acc="${sec.id}">
      <div class="accordion-title"><span class="accordion-num">${sec.num}</span> ${sec.title}</div>
      <span class="accordion-chevron">›</span>
    </div>
    <div class="accordion-body">
      <div class="field-grid wide">
        ${sec.fields.map(f=>fieldHTML(sec.id, f)).join('')}
      </div>
    </div>
  </div>`;
}

function fieldHTML(secId, f){
  const val = state.patient.data[f.key];
  if(f.type==='text'){
    return `<div class="field"><label>${f.label}</label><input type="text" data-gen data-key="${f.key}" value="${esc(val||'')}"></div>`;
  }
  if(f.type==='textarea'){
    return `<div class="field span2"><label>${f.label}</label><textarea data-gen data-key="${f.key}" rows="2">${esc(val||'')}</textarea></div>`;
  }
  if(f.type==='radio'){
    return `<div class="field"><label>${f.label}</label><div class="chip-group" data-radio-group="${f.key}">
      ${f.options.map(o=>`<span class="chip ${val===o?'chip-active':''}" data-radio="${f.key}" data-val="${esc(o)}">${o}</span>`).join('')}
    </div></div>`;
  }
  if(f.type==='chips'){
    const arr = Array.isArray(val)?val:[];
    return `<div class="field span2"><label>${f.label}</label><div class="chip-group" data-chip-group="${f.key}">
      ${f.options.map(o=>`<span class="chip ${arr.includes(o)?'chip-active':''}" data-chip="${f.key}" data-val="${esc(o)}">${o}</span>`).join('')}
    </div></div>`;
  }
  return '';
}

function bindSectionFields(container){
  container.querySelectorAll('[data-gen]').forEach(el=>{
    const ev = el.tagName==='TEXTAREA' || el.type==='text' ? 'input' : 'change';
    el.addEventListener(ev, ()=>{ state.patient.data[el.getAttribute('data-key')] = el.value; queueSave(); });
  });
  container.querySelectorAll('[data-radio]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const key = chip.getAttribute('data-radio');
      const val = chip.getAttribute('data-val');
      state.patient.data[key] = (state.patient.data[key]===val) ? '' : val;
      container.querySelectorAll(`[data-radio="${key}"]`).forEach(c=>c.classList.toggle('chip-active', c.getAttribute('data-val')===state.patient.data[key]));
      queueSave();
    });
  });
  container.querySelectorAll('[data-chip]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const key = chip.getAttribute('data-chip');
      const val = chip.getAttribute('data-val');
      let arr = Array.isArray(state.patient.data[key]) ? state.patient.data[key] : [];
      if(arr.includes(val)) arr = arr.filter(v=>v!==val); else arr = [...arr, val];
      state.patient.data[key] = arr;
      chip.classList.toggle('chip-active', arr.includes(val));
      queueSave();
    });
  });
}

function bindAccordions(container){ /* handled globally after full render; placeholder for future per-container logic */ }

/* ---------- Cinco Movimentos accordion ---------- */
function elementsAccordionHTML(){
  const isOpen = !!state.open.movimentos;
  return `<div class="accordion ${isOpen?'open':''}" id="acc-movimentos">
    <div class="accordion-head" data-acc="movimentos">
      <div class="accordion-title"><span class="accordion-num">09</span> Cinco Movimentos (perfil constitucional)</div>
      <span class="accordion-chevron">›</span>
    </div>
    <div class="accordion-body">
      <div class="elements-layout">
        <div class="radar-box">
          <div id="radar-chart">${radarSVG(state.patient.movimentos)}</div>
          <div class="radar-caption">Fingerprint constitucional — quanto mais o vértice se estende, maior a proporção de sinais anormais marcados naquele movimento.</div>
        </div>
        <div>
          ${ELEMENTOS.map(e=>elementBlockHTML(e)).join('')}
        </div>
      </div>
    </div>
  </div>`;
}
function elementBlockHTML(e){
  const mov = state.patient.movimentos[e.key] || {normal:[],anormal:[]};
  return `<div class="element-block" style="border-color:${e.color}33">
    <div class="element-title"><span class="element-dot" style="background:${e.color}"></span>${e.label}</div>
    <div class="element-sub">Normal</div>
    <div class="chip-group">${e.normal.map(o=>`<span class="chip ${mov.normal.includes(o)?'chip-active':''}" data-mov="${e.key}" data-kind="normal" data-val="${esc(o)}">${o}</span>`).join('')}</div>
    <div class="element-sub">Anormal</div>
    <div class="chip-group">${e.anormal.map(o=>`<span class="chip ${mov.anormal.includes(o)?'chip-active chip-alert':''}" data-mov="${e.key}" data-kind="anormal" data-val="${esc(o)}">${o}</span>`).join('')}</div>
  </div>`;
}
function bindElementChips(){
  document.querySelectorAll('[data-mov]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const ek = chip.getAttribute('data-mov'), kind = chip.getAttribute('data-kind'), val = chip.getAttribute('data-val');
      const mov = state.patient.movimentos[ek];
      let arr = mov[kind];
      if(arr.includes(val)) arr = arr.filter(v=>v!==val); else arr = [...arr, val];
      mov[kind] = arr;
      const active = arr.includes(val);
      chip.classList.toggle('chip-active', active);
      chip.classList.toggle('chip-alert', active && kind==='anormal');
      refreshRadar();
      queueSave();
    });
  });
}
function refreshRadar(){
  const box = document.getElementById('radar-chart');
  if(box) box.innerHTML = radarSVG(state.patient.movimentos);
}

/* ---------- Tratamentos (sessions) ---------- */
function tratamentoBodyHTML(){
  const p = state.patient;
  return `
    <div class="chart-box">
      <div class="chart-legend">
        <span><span class="legend-dot" style="background:#9F4A2E"></span>Dor (0–10)</span>
        <span><span class="legend-dot" style="background:#496449"></span>Mobilidade (0–10)</span>
      </div>
      ${evolutionChartSVG(p.sessions)}
    </div>

    <div class="session-timeline">
      ${p.sessions.length ? [...p.sessions].reverse().map(sessionCardHTML).join('') : '<div style="color:#8b9a94;font-size:13.5px;">Nenhuma sessão registrada ainda.</div>'}
    </div>

    <div style="margin-top:14px;">
      <button class="btn btn-primary" id="btn-new-session">+ Registrar sessão de tratamento</button>
    </div>
    <div id="new-session-slot"></div>
  `;
}

function sessionCardHTML(s){
  return `<div class="session-card">
    <div class="session-card-head">
      <span class="session-num">Sessão ${s.numero}</span>
      <span class="session-date">${fmtDate(s.data)}${s.hora ? ' · '+s.hora+'h' : ''} ${s.atendidoPor ? '· '+esc(s.atendidoPor) : ''}</span>
    </div>
    ${s.sensibilidade ? `<div class="session-body"><strong>Sensibilidade em acupontos:</strong> ${esc(s.sensibilidade)}</div>` : ''}
    ${s.pontos ? `<div class="session-body"><strong>Pontos do tratamento:</strong> ${esc(s.pontos)}</div>` : ''}
    ${s.modalidades && s.modalidades.length ? `<div class="session-tags">${s.modalidades.map(m=>`<span class="tag-pill">${esc(m)}</span>`).join('')}</div>` : ''}
    ${s.pulso || s.lingua ? `<div class="session-body">${s.pulso?`<strong>Pulso:</strong> ${esc(s.pulso)} `:''}${s.lingua?`&nbsp;&nbsp;<strong>Língua:</strong> ${esc(s.lingua)}`:''}</div>` : ''}
    ${s.evolucao ? `<div class="session-body" style="margin-top:6px;">${esc(s.evolucao)}</div>` : ''}
    <div class="score-row">
      ${s.dor!==undefined && s.dor!=='' ? `<span class="score-chip dor">Dor ${s.dor}/10</span>` : ''}
      ${s.mobilidade!==undefined && s.mobilidade!=='' ? `<span class="score-chip mob">Mobilidade ${s.mobilidade}/10</span>` : ''}
    </div>
  </div>`;
}

function bindTratamento(){
  document.getElementById('btn-new-session').addEventListener('click', ()=>{
    document.getElementById('new-session-slot').innerHTML = newSessionFormHTML();
    bindNewSessionForm();
    document.getElementById('btn-new-session').style.display='none';
  });
}

function newSessionFormHTML(){
  const nextNum = (state.patient.sessions.length||0) + 1;
  return `<div class="new-session-form">
    <div class="section-eyebrow">Nova sessão · nº ${nextNum}</div>
    <div class="field-grid">
      <div class="field"><label>Data</label><input type="date" id="ns-data" value="${nowISODate()}"></div>
      <div class="field"><label>Hora</label><input type="time" id="ns-hora" value="${nowTime()}"></div>
      <div class="field"><label>Atendido por</label><input type="text" id="ns-atendido" value="${esc(state.patient.veterinaria||'')}"></div>
    </div>
    <div class="field-grid wide">
      <div class="field span2"><label>Sensibilidade em acupontos diagnósticos</label><input type="text" id="ns-sensibilidade"></div>
      <div class="field span2"><label>Pontos do tratamento</label><textarea id="ns-pontos" rows="2"></textarea></div>
    </div>
    <div class="field" style="margin-bottom:14px;">
      <label>Modalidades aplicadas</label>
      <div class="chip-group" id="ns-modalidades">
        ${MODALIDADES.map(m=>`<span class="chip" data-ns-modal="${esc(m)}">${m}</span>`).join('')}
      </div>
    </div>
    <div class="field-grid">
      <div class="field"><label>Pulso</label><input type="text" id="ns-pulso"></div>
      <div class="field"><label>Língua</label><input type="text" id="ns-lingua"></div>
    </div>
    <div class="field" style="margin-bottom:10px;">
      <label>Evolução / comentários</label>
      <textarea id="ns-evolucao" rows="3"></textarea>
    </div>
    <div class="field-grid">
      <div class="field"><label>Escala de dor (0–10)</label>
        <div class="slider-row"><input type="range" min="0" max="10" value="0" id="ns-dor"><span class="slider-val" id="ns-dor-val">0</span></div>
      </div>
      <div class="field"><label>Escala de mobilidade (0–10)</label>
        <div class="slider-row"><input type="range" min="0" max="10" value="0" id="ns-mob"><span class="slider-val" id="ns-mob-val">0</span></div>
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:12px;">
      <button class="btn btn-primary" id="ns-save">Salvar sessão</button>
      <button class="btn btn-ghost" id="ns-cancel">Cancelar</button>
    </div>
  </div>`;
}

function bindNewSessionForm(){
  let selectedModal = [];
  document.querySelectorAll('[data-ns-modal]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const v = chip.getAttribute('data-ns-modal');
      if(selectedModal.includes(v)){ selectedModal = selectedModal.filter(x=>x!==v); } else { selectedModal.push(v); }
      chip.classList.toggle('chip-active', selectedModal.includes(v));
    });
  });
  document.getElementById('ns-dor').addEventListener('input', e=> document.getElementById('ns-dor-val').textContent = e.target.value);
  document.getElementById('ns-mob').addEventListener('input', e=> document.getElementById('ns-mob-val').textContent = e.target.value);

  document.getElementById('ns-cancel').addEventListener('click', ()=>{
    document.getElementById('new-session-slot').innerHTML='';
    document.getElementById('btn-new-session').style.display='inline-flex';
  });

  document.getElementById('ns-save').addEventListener('click', ()=>{
    const nextNum = (state.patient.sessions.length||0) + 1;
    const session = {
      numero: nextNum,
      data: document.getElementById('ns-data').value,
      hora: document.getElementById('ns-hora').value,
      atendidoPor: document.getElementById('ns-atendido').value,
      sensibilidade: document.getElementById('ns-sensibilidade').value,
      pontos: document.getElementById('ns-pontos').value,
      modalidades: selectedModal,
      pulso: document.getElementById('ns-pulso').value,
      lingua: document.getElementById('ns-lingua').value,
      evolucao: document.getElementById('ns-evolucao').value,
      dor: document.getElementById('ns-dor').value,
      mobilidade: document.getElementById('ns-mob').value,
    };
    state.patient.sessions.push(session);
    if(state.patient.status==='avaliacao') state.patient.status='tratamento';
    queueSave();
    state.open.tratamento = true;
    document.getElementById('tratamento-body').innerHTML = tratamentoBodyHTML();
    bindTratamento();
    showToast('Sessão registrada');
  });
}

boot();
</script>
